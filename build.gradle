plugins {
    id "dev.architectury.loom" version "1.7.417"
    id "java"
}

version = "1.1.73"
group = "com.zzynes.sarcophag"

base {
    archivesName = "sarcophag"
}

loom {
    silentMojangMappingsLicense()
    forge {
        mixinConfig "sarcophag.mixins.json", "sarcophag_water.mixins.json"
    }
}

repositories {
    maven { url = "https://maven.minecraftforge.net/" }
    maven { url = "https://maven.architectury.dev/" }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:1.20.1-47.3.0"
    modImplementation "software.bernie.geckolib:geckolib-forge-1.20.1:4.4.4"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

jar {
    manifest {
        attributes(
            "MixinConfigs": "sarcophag.mixins.json,sarcophag_water.mixins.json"
        )
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
