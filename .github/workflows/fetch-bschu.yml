name: Fetch BSHU DropMeFiles

on:
  push:
    branches:
      - "arena/d917b94c-rlllrrr"
    paths:
      - "ci-output/fetch-bschu.trigger"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fetch files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/files out/extracted
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          PAGE='https://dropmefiles.com/K3dt1'
          curl -fL --retry 3 --retry-delay 2 -A "$UA" -H 'Accept-Language: ru,en;q=0.8' -c cookies.txt -b cookies.txt "$PAGE" -o out/page.html
          python3 - <<'PY'
          import html
          import re
          from pathlib import Path
          page = Path('out/page.html').read_text(encoding='utf-8', errors='ignore')
          items = []
          seen = set()
          def add(filename, url):
              filename = html.unescape(filename).strip().replace('\\', '/').split('/')[-1]
              url = html.unescape(url).strip()
              if not filename or not url.startswith(('http://', 'https://')):
                  return
              key = (filename, url)
              if key in seen:
                  return
              seen.add(key)
              items.append(key)
          for match in re.finditer(r'data-downloadurl="([^"]+)"', page):
              raw = html.unescape(match.group(1))
              parts = raw.split(':', 2)
              if len(parts) == 3:
                  add(parts[1], parts[2])
          start = re.search(r'<[^>]*class="[^"]*start_dl_btn[^"]*"[^>]*>', page, flags=re.I | re.S)
          if start:
              href = re.search(r'data-href="([^"]+)"', start.group(0), flags=re.I)
              if href:
                  add('download_all.bin', href.group(1))
          with Path('out/downloads.tsv').open('w', encoding='utf-8') as stream:
              for filename, url in items:
                  stream.write(f'{filename}\t{url}\n')
          Path('out/page-summary.txt').write_text(
              'download candidates: ' + str(len(items)) + '\n' +
              '\n'.join(f'{name} -> {url}' for name, url in items) + '\n',
              encoding='utf-8'
          )
          print(Path('out/page-summary.txt').read_text(encoding='utf-8'))
          if not items:
              raise SystemExit('No data-downloadurl or start data-href found')
          PY
          while IFS=$'\t' read -r filename url; do
            safe=$(printf '%s' "$filename" | tr '/' '_' | tr -cd '[:print:]')
            if [ -z "$safe" ]; then
              safe='download.bin'
            fi
            target="out/files/$safe"
            if [ -e "$target" ]; then
              target="${target}.next"
            fi
            echo "Downloading $safe"
            curl -fL --retry 3 --retry-delay 2 -A "$UA" -H 'Accept-Language: ru,en;q=0.8' -b cookies.txt -e "$PAGE" "$url" -o "$target" || echo "FAILED $safe $url" >> out/failures.txt
          done < out/downloads.tsv
          python3 - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path
          lines = []
          for path in sorted(Path('out/files').iterdir()):
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              lines.append(f'{path.name}\t{len(data)}\t{digest}\t{data[:16]!r}')
              if zipfile.is_zipfile(path):
                  target = Path('out/extracted') / path.stem
                  target.mkdir(parents=True, exist_ok=True)
                  with zipfile.ZipFile(path) as archive:
                      lines.append('ZIP ' + path.name + ': ' + ', '.join(archive.namelist()))
                      try:
                          archive.extractall(target, pwd=b'123')
                      except RuntimeError:
                          archive.extractall(target)
          Path('out/files-summary.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY
          find out -type f -printf '%p %s bytes\n' | sort

      - name: Publish fetched files to branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci-output/bschu-input
          mkdir -p ci-output/bschu-input
          cp -a out/. ci-output/bschu-input/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-output/bschu-input
          if git diff --cached --quiet; then
            echo "No fetched files to publish"
            exit 0
          fi
          git commit -m "Add fetched BSHU input [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload fetched files
        uses: actions/upload-artifact@v4
        with:
          name: bschu-dropmefiles
          path: out/**
          if-no-files-found: error
          retention-days: 3
