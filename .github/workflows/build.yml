name: Build mod jar

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build with Gradle
        run: |
          set -o pipefail
          gradle build --no-daemon -x test --stacktrace 2>&1 | tee build-output.log

      - name: Publish build errors
        if: failure()
        run: |
          if [ -f build-output.log ]; then
            grep -n -A4 -E "error:" build-output.log | head -n 300 > build-error.txt
            grep -n -E "What went wrong" -A6 build-output.log >> build-error.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-error.txt
          git commit -m "Build log [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: List built jars
        if: success()
        run: ls -lah build/libs

      - name: Publish jar to jar folder
        if: success()
        run: |
          mkdir -p jar
          rm -f jar/*.jar
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar) ;;
              *) cp "$f" jar/ ;;
            esac
          done
          ls -lah jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A jar
          if git diff --cached --quiet; then
            echo "jar is up to date"
          else
            git commit -m "Publish jar [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sarcophag-jar
          path: build/libs/*.jar
          if-no-files-found: error
