name: Build mod jar

on:
  push:
    branches:
      - "arena/**"
    paths-ignore:
      - "ci-output/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build with Gradle
        run: |
          set -o pipefail
          gradle build --no-daemon -x test --stacktrace 2>&1 | tee build-output.log

      - name: List built jars
        if: success()
        run: ls -lah build/libs

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fly_drone-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish outputs to branch
        if: always()
        run: |
          mkdir -p ci-output
          tail -n 4000 build-output.log > ci-output/build-output.log || true
          cp build/libs/fly_drone-*.jar ci-output/ 2>/dev/null || true
          rm -f ci-output/*-sources.jar ci-output/*-dev.jar ci-output/*-javadoc.jar
          ls -lah ci-output || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-output
          if git diff --cached --quiet; then
            echo "No outputs to publish"
            exit 0
          fi
          git commit -m "CI outputs [skip ci]"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}" || { git rebase --abort; echo "Rebase failed, skipping publish"; exit 0; }
          git push origin "HEAD:${{ github.ref_name }}"
